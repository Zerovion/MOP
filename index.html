<style>

.w{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;border-bottom:3px double var(--i);padding-bottom:12px;margin-bottom:18px}

.chip span{font-size:.88em;color:var(--m)}
.chip:hover,.chip.ok{background:var(--g);color:#fff}.chip:hover b,.chip:hover span,.chip.ok b,.chip.ok span{color:#fff}

.sc{background:var(--c);border:2px solid var(--i);border-radius:16px 4px 16px 4px/4px 16px 4px 16px;padding:8px;--k:var(--g)}

.how{margin:10px 0}
.ln{stroke:var(--i);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.t{font:11px ui-monospace,Consolas,monospace;fill:var(--i)}
.spin{animation:spin 2.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sm circle{fill:var(--m);animation:rise 2s ease-out infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-34px);opacity:0}}
.dr circle{fill:#4a8fd0;animation:fall 1.6s ease-in infinite}@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:0}}

.draw{stroke-dasharray:100;animation:draw 4s ease-in-out infinite}@keyframes draw{from{stroke-dashoffset:100}65%,to{stroke-dashoffset:0}}
.tilt{animation:tilt 3s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s ease-out both}@keyframes grow{from{transform:scaleY(0)}}
.fw{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0 8px}
.stp{background:var(--c);border:2px solid var(--i);border-radius:10px 3px 10px 3px;padding:8px 10px}
.stp h3{font-size:1.05em;margin:2px 0 6px}.stp small{color:var(--m)}
.pw{width:100%;height:auto;margin-bottom:10px}
.qz{max-width:560px}.qz h2{margin:6px 0 16px;font-size:1.6em}
#fb{min-height:3em}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:center;margin-bottom:26px;padding:20px;background:var(--c);border:2px solid var(--i);border-radius:20px 5px 22px 5px/5px 22px 5px 20px}
.hero h2{font-size:2.1em;margin-bottom:8px}.hero p{margin:0 0 14px}.hero svg{width:100%;height:auto}
.go{background:var(--r);color:var(--p);border:0;border-radius:999px;padding:10px 24px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .15s}

.bar2{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:14px 0 4px;border:1px solid var(--m)}.bar2 i{display:block;height:100%;background:var(--r);transition:width .4s}

.band{background:var(--g);color:#fff;font-weight:600;border-radius:14px 3px 14px 3px;padding:2px 12px;display:inline-block;font-size:.85em;margin-bottom:8px}
.nv{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.paused *{animation-play-state:paused!important}
.v{animation:vin .3s ease-out}@keyframes vin{from{opacity:0;transform:translateY(8px)}}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
body{background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/48px 48px,var(--p)}
h1,h2,h3,h4{font-family:"Arial Black","Segoe UI Black","Helvetica Neue",system-ui,sans-serif;font-weight:900;letter-spacing:-.02em}
header{border-bottom:0}header h1{font-size:2.4em;color:var(--r)}
.tab{border:1px solid var(--m);border-radius:999px;background:transparent;padding:5px 16px}
.tab.on,.tab:hover{background:var(--r);color:var(--oa);border-color:var(--r)}
.hero{border:1px solid var(--m);border-radius:26px;padding:30px}.hero h2{font-size:3em;line-height:1.02}
.go{color:var(--oa)}
.top{border:0;background:var(--r);color:var(--oa);border-radius:14px;padding:8px 22px}
.cl h3{border-bottom:0;border-left:8px solid var(--g);padding-left:10px;font-size:1.3em}
.chip{background:var(--c);border:1px solid rgba(150,170,255,.25);border-left:6px solid var(--g);border-radius:12px}

.chip:hover,.chip.ok{background:var(--g);color:#fff}.chip:hover b,.chip:hover span,.chip.ok b,.chip.ok span{color:#fff}
.band{color:#fff}
.dt h2{font-size:4.2em;color:var(--g)}
.sc{background:var(--c);border:1px solid var(--g);border-radius:22px;padding:16px;box-shadow:0 0 0 5px color-mix(in srgb,var(--g) 16%,transparent)}

.stp{border:1px solid var(--m);border-radius:16px}

.fq{font-size:2.4em;font-weight:800}
.mp{fill:var(--r)}.fade{animation:fin 1s both}@keyframes fin{from{opacity:0}}
.hit{animation:hit 1.6s ease-in-out infinite}@keyframes hit{0%,55%,100%{transform:rotate(-24deg)}70%{transform:rotate(8deg)}}
.fl2{transform-box:fill-box;transform-origin:50% 100%;animation:fl2 .45s ease-in-out infinite alternate}@keyframes fl2{to{transform:scaleY(1.3)}}
.bl{animation:bl 1.8s ease-in-out infinite alternate}@keyframes bl{from{opacity:.12}}
.rod{animation:rod 2.4s ease-in-out infinite alternate}@keyframes rod{to{transform:translateY(14px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.2s ease-in-out infinite alternate}@keyframes pu{to{transform:scale(1.35)}}
.sc .hl{fill:var(--r);font-size:15px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

function map(){view='map';M.innerHTML=`<div class="hero"><div><h2>Who keeps the lights on?</h2><p>${O.length} bodies work under or beside the Ministry of Power. Follow electricity from plant to plug, then open any body to see how it really works.</p><button class="go" data-st>Start the tour</button><div class="bar2"><i style="width:${seen.size/O.length*100}%"></i></div><span class="mono">${seen.size} of ${O.length} explored</span></div>${HERO}</div><div class="top"><h2>Ministry of Power</h2><span class="mono">Government of India</span></div><div class="cl">`+Object.entries(G).map(([k,[n,c,t]])=>`<section style="--g:${c}"><h3>${n}</h3><p class="hand">${t}</p>`+O.filter(o=>o.g==k).map(o=>`<button class="chip${seen.has(o.i)?' seen':''}" data-o="${o.i}"><b class="mono">${o.i}</b><span>${o.r}</span></button>`).join('')+`</section>`).join('')+`</div>`}
const ST={

const SIM=`<div class="sim"><h4>Try it: hold 50 Hz</h4><label>Demand<input type="range" min="70" max="130" value="100" id="dm"></label><div class="fq mono" id="fq"></div><div class="gauge"><i id="gi"></i></div><p id="fm"></p><button class="tab" data-g="-5">Lower generation</button><button class="tab" data-g="5">Raise generation</button></div>`;
let tm,si=0,gen=100;
function upd(){const d=+document.getElementById('dm').value,f=50+(gen-d)*.05,ok=f>=49.9&&f<=50.05;document.getElementById('fq').textContent=f.toFixed(2)+' Hz  (generation '+gen+')';document.getElementById('gi').style.left=Math.max(0,Math.min(97,(f-49)/2*100))+'%';document.getElementById('fm').textContent=ok?'Balanced. The frequency is inside the safe band.':f<49.9?'Demand is higher than generation. Raise generation.':'Generation is higher than demand. Lower generation.'}
function tick(){clearInterval(tm);tm=setInterval(()=>{si=(si+1)%ST[O[cur].i].length;show()},3400)}
function show(){document.querySelectorAll('.stp2').forEach((b,k)=>b.classList.toggle('on',k==si));document.getElementById('cap').textContent=ST[O[cur].i][si][1]}
function det(i){view='det';cur=O.findIndex(o=>o.i==i);const o=O[cur],st=ST[o.i];seen.add(o.i);gen=100;si=0;M.innerHTML=`<button class="tab" data-v="map">Back to map</button><div class="dt" style="--g:${G[o.g][1]}"><div><span class="band">${G[o.g][0]}</span><h2 class="mono">${o.i}</h2><p class="mono sub">${o.f}</p><p class="role">${o.r}</p><h4>The problem it solves</h4><p>${o.p}</p><h4>Works with</h4><div>${o.w.map(x=>`<button class="tab" data-o="${x}">${x}</button>`).join('')}</div><p class="hand note2">${o.d}</p></div><div><div class="sc" id="sc">${scene(o)}</div><div class="steps">${st.map((x,k)=>`<button class="stp2" data-s="${k}"><b class="mono">${k+1}</b><span>${x[0]}</span></button>`).join('')}</div><p class="cap" id="cap"></p><p class="how"><b>In short.</b> ${o.h}</p>${o.i=='NLDC'||o.i=='RLDC'?SIM:''}<div class="nv"><button class="tab" data-pv>Previous</button><button class="tab" data-rp>Replay</button><button class="tab" data-ps>Pause</button><button class="tab" data-ni>Next</button><span class="mono">${cur+1} of ${O.length}</span></div></div></div>`;show();tick();if(document.getElementById('dm'))upd()}
function flow(){view='flow';const st=[['Generation',['NTPC','NHPC','NLCL','NPC','MNRES']],['Transmission',['PGCIL']],['Load dispatch',['NLDC','RLDC','REB']],['Distribution',[]],['Consumer',[]]];M.innerHTML=`<h2>From plant to plug</h2><p>Power moves through five steps. The bodies on the map sit at different points along the way.</p><div class="fw">${st.map(([n,l],k)=>`<div class="stp"><span class="mono">${k+1}</span><h3>${n}</h3>${l.map(x=>`<button class="tab" data-o="${x}">${x}</button>`).join('')||`<small>${k==3?'State discoms. Not under MoP, but this is where restructuring bites.':'That is you.'}</small>`}</div>`).join('')}</div><svg viewBox="0 0 500 16" class="pw"><path class="ln dash" d="M4 8H496"/><circle class="pl" r="6" cx="4" cy="8" style="--d:490px"/></svg><p class="hand">From the side: CEA plans the system, CERC sets the tariffs, PFC and REC pay for it, PTC trades the surplus, and BEE trims the demand.</p><p>In a restructured system these steps become separate companies: Genco, Transco and Discom.</p>`}
const Q=[['Who finances rural electrification?','REC',['PGCIL','REC','BEE']],['Which body is the central transmission utility?','PGCIL',['PGCIL','CEA','PTC']],['Who prepares national power planning?','CEA',['CERC','NLDC','CEA']],['Who handles tariff, legal and regulatory issues?','CERC',['CERC','PFC','NPTI']],['Which body is responsible for hydro generation?','NHPC',['NTPC','NHPC','NPC']],['Who runs the grid inside one region?','RLDC',['RLDC','REB','CPRI']],['Who trades power between buyers and sellers?','PTC',['REC','PTC','BEE']],['Who estimates energy conservation and DSM potential?','BEE',['BEE','CPRI','NLCL']]];

else if('ps' in d){const c=document.getElementById('sc');c.classList.toggle('paused');const pz=c.classList.contains('paused');t.textContent=pz?'Play':'Pause';pz?clearInterval(tm):tick()}
else if(d.s){si=+d.s;show();tick()}
else if(d.g){gen+=+d.g;upd()}
else if('st' in d)det(O[0].i);
else if('pv' in d||'ni' in d)det(O[(cur+('ni' in d?1:O.length-1))%O.length].i);
else if('qr' in d){qi=qs=0;quiz()}else if('nx' in d){qi++;quiz()}
else if(d.a&&!done){done=true;const[q,a]=Q[qi],o=O.find(x=>x.i==a),ok=d.a==a;qs+=ok;t.classList.add(ok?'ok':'no');if(!ok)document.querySelector(`[data-a="${a}"]`).classList.add('ok');document.getElementById('fb').innerHTML=`${ok?'Right.':'Not quite.'} ${o.i} (${o.f}): ${o.r}. <button class="tab" data-nx>${qi==Q.length-1?'See score':'Next question'}</button>`}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')go('map');else if(e.key=='f'||e.key=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}else if(view=='det'&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){det(O[(cur+(e.key=='ArrowRight'?1:O.length-1))%O.length].i)}});
document.addEventListener('input',e=>{if(e.target.id=='dm')upd()});
new MutationObserver(()=>{M.classList.remove('v');void M.offsetWidth;M.classList.add('v')}).observe(M,{childList:true});
map();
